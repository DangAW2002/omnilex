name: Validate Data and Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build core, CLI, and artifacts
        run: pnpm build

      - name: Run Unit Tests
        run: pnpm test

      - name: Run OmniLex Validation (Strict)
        run: pnpm ol validate --strict

      - name: Build site
        run: pnpm --filter @omnilex/site build

      - name: Check for uncommitted build drift
        run: |
          git diff --exit-code indexes/ llms.txt

      - name: Check build determinism (D-4)
        run: pnpm check:deterministic

      - name: Check performance budget (T-B2)
        run: pnpm bench:check
